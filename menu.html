<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🍳 我的菜单</title>
<style>
:root{
  --accent:#e8590c; --accent2:#f76707; --bg:#faf7f2; --card:#fff;
  --text:#2b2723; --muted:#8a817a; --line:#eee5db; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
header{background:linear-gradient(135deg,#e8590c,#f76707);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(232,89,12,.25)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:960px;margin:0 auto}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
h1 .ver{font-size:11px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:99px;font-weight:400}
.hbtns{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 12px;border-radius:10px;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}
.hbtn.primary{background:#fff;color:var(--accent);font-weight:700;border-color:#fff}
.hbtn:active{transform:scale(.96)}
.searchbar{max-width:960px;margin:10px auto 0;display:flex;gap:8px}
.searchbar input{flex:1;border:none;border-radius:10px;padding:9px 14px;font-size:14px;outline:none;background:rgba(255,255,255,.92)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;max-width:960px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.grid{max-width:960px;margin:12px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media(max-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(43,39,35,.07);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;border:1px solid var(--line)}
.card:active{transform:scale(.97)}
.cimg{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f3ede4}
.cimg.ph{display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#fff4e6,#ffe8cc)}
.cbody{padding:10px 12px 12px}
.cname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--muted)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.cacts{display:flex;gap:4px;margin-top:8px}
.abtn{flex:1;border:none;background:#faf5ef;border-radius:8px;padding:5px 0;font-size:12px;cursor:pointer;color:var(--text)}
.abtn:active{background:#f1e8dd}
.abtn.del{color:#d9480f}
.empty{max-width:960px;margin:60px auto;text-align:center;color:var(--muted)}
.empty .big{font-size:56px;margin-bottom:12px}
.hint{max-width:960px;margin:8px auto 0;padding:0 16px;font-size:12px;color:var(--muted);text-align:center}

/* 弹层 */
.overlay{position:fixed;inset:0;background:rgba(30,25,20,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px;-webkit-overflow-scrolling:touch}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25);margin:auto 0}
.modal h3{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.xbtn{border:none;background:#f3ede4;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input[type=text],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;background:#fffdf9}
.field textarea{resize:vertical;min-height:70px;line-height:1.7}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2)}
.autocat{font-size:11px;color:var(--accent);margin-top:4px}
.imgmgr{border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;background:#fffdf9}
.imgmgr .prev{width:86px;height:86px;border-radius:10px;object-fit:cover;background:#f3ede4;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.imgbtns{display:flex;flex-direction:column;gap:6px;flex:1}
.imgbtns button{border:none;border-radius:8px;padding:7px;font-size:12px;cursor:pointer;background:#faf5ef;color:var(--text)}
.imgbtns button.warn{color:#d9480f}
.mfoot{display:flex;gap:10px;margin-top:16px}
.mfoot button{flex:1;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
.btn-cancel{background:#f3ede4;color:var(--muted)}
.btn-save{background:linear-gradient(135deg,#e8590c,#f76707);color:#fff}
.mfoot button:active{opacity:.85}

/* 菜谱分享卡（双击放大） */
.dcard{background:linear-gradient(180deg,#fff,#fff9f2);border-radius:20px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.35)}
.dcard .hero{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f3ede4}
.dcard .hero.ph{display:flex;align-items:center;justify-content:center;font-size:110px;background:linear-gradient(135deg,#fff4e6,#ffe8cc)}
.dcard .inner{padding:18px 20px 20px}
.dcard .dtop{display:flex;align-items:center;gap:10px}
.dcard .dname{font-size:24px;font-weight:800;letter-spacing:1px}
.dcard .sect{margin-top:14px}
.dcard .sect h4{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ingwrap{display:flex;flex-wrap:wrap;gap:6px}
.ing{background:#fff4e6;color:#a8580c;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid #ffe8cc}
.steplist{counter-reset:st}
.step{display:flex;gap:10px;margin-bottom:9px;font-size:13.5px;line-height:1.65}
.step .no{counter-increment:st;flex-shrink:0;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#e8590c,#f76707);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step .no::before{content:counter(st)}
.dcard .foot{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px}
.dclose{margin:14px auto 0;display:block;border:none;background:rgba(255,255,255,.9);color:#5c4a3a;border-radius:99px;padding:8px 26px;font-size:13px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(43,39,35,.9);color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>🍳 我的菜单 <span class="ver">v0.1 原型</span></h1>
    <div class="hbtns">
      <button class="hbtn" onclick="importJson()">📥 导入</button>
      <button class="hbtn" onclick="exportJson()">📤 导出</button>
      <button class="hbtn primary" onclick="openEdit()">➕ 添加菜品</button>
    </div>
  </div>
  <div class="searchbar"><input id="q" type="text" placeholder="搜索菜名 / 食材…" oninput="render()"></div>
</header>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="hint">💡 双击菜品卡片可放大查看 · 图片不合适可删掉或上传实拍图</div>

<!-- 添加/编辑弹窗 -->
<div class="overlay" id="editOv">
  <div class="modal">
    <h3><span id="editTitle">添加菜品</span><button class="xbtn" onclick="closeEdit()">✕</button></h3>
    <div class="field">
      <label>菜名 *</label>
      <input type="text" id="fName" placeholder="如：清蒸鲈鱼" oninput="onNameInput()">
      <div class="autocat" id="autoHint"></div>
    </div>
    <div class="field">
      <label>分类</label>
      <select id="fCat"></select>
    </div>
    <div class="field">
      <label>食材（每行一种，含用量更清晰）</label>
      <textarea id="fIng" placeholder="鲈鱼 1条（约500g）&#10;葱姜 适量&#10;蒸鱼豉油 2勺"></textarea>
    </div>
    <div class="field">
      <label>制作过程（每行一步）</label>
      <textarea id="fSteps" placeholder="鱼身划刀，抹料酒腌10分钟&#10;水开后大火蒸8分钟&#10;淋蒸鱼豉油，浇热油"></textarea>
    </div>
    <div class="field">
      <label>图片</label>
      <div class="imgmgr">
        <img class="prev" id="imgPrev" alt="">
        <div class="imgbtns">
          <button onclick="reMatchImg()">🎲 按分类重新配图</button>
          <button onclick="document.getElementById('imgFile').click()">📷 上传实拍图</button>
          <button class="warn" onclick="removeImg()">🗑 删除图片（用占位图）</button>
        </div>
      </div>
      <input type="file" id="imgFile" accept="image/*" style="display:none" onchange="onImgPick(this)">
    </div>
    <div class="mfoot">
      <button class="btn-cancel" onclick="closeEdit()">取消</button>
      <button class="btn-save" onclick="saveDish()">保存</button>
    </div>
  </div>
</div>

<!-- 详情/分享卡 -->
<div class="overlay" id="detailOv" onclick="if(event.target===this)closeDetail()">
  <div class="dcard" id="dcard"></div>
  <button class="dclose" onclick="closeDetail()">收起</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 分类与配图 ============ */
var CATS = [
  {key:'zheng',  label:'蒸菜', emoji:'🐟'},
  {key:'chao',   label:'炒菜', emoji:'🥘'},
  {key:'tang',   label:'汤品', emoji:'🍲'},
  {key:'liang',  label:'凉菜', emoji:'🥗'},
  {key:'dun',    label:'炖菜', emoji:'🍖'},
  {key:'kao',    label:'烤炸', emoji:'🍗'},
  {key:'zhushi', label:'主食', emoji:'🍜'},
  {key:'tianpin',label:'甜品', emoji:'🍡'},
  {key:'other',  label:'其他', emoji:'🍽️'}
];
var CAT_COLOR = {
  zheng:'#0b7285', chao:'#d9480f', tang:'#087f5b', liang:'#2f9e44',
  dun:'#c2255c', kao:'#e8590c', zhushi:'#5f3dc4', tianpin:'#ae3ec9', other:'#868e96'
};
function catLabel(k){for(var i=0;i<CATS.length;i++)if(CATS[i].key===k)return CATS[i].label;return '其他';}
function catEmoji(k){for(var i=0;i<CATS.length;i++)if(CATS[i].key===k)return CATS[i].emoji;return '🍽️';}

/* 关键词自动分类（顺序即优先级） */
var CAT_RULES = [
  ['tang',    /汤|羹|煨/],
  ['zheng',   /蒸/],
  ['chao',    /炒|爆|溜/],
  ['dun',     /炖|烧|焖|烩|卤煮/],
  ['kao',     /烤|炸|煎|锅巴/],
  ['liang',   /凉拌|凉菜|拌|白灼|卤(?!煮)/],
  ['tianpin', /甜品|甜点|糕|布丁|奶茶|糖水|双皮奶|汤圆|芋圆/],
  ['zhushi',  /饭|面|粉|粥|饺子|包子|馒头|饼|炒饭|盖浇/]
];
function detectCat(name){
  if(!name) return 'other';
  for(var i=0;i<CAT_RULES.length;i++){ if(CAT_RULES[i][1].test(name)) return CAT_RULES[i][0]; }
  return 'other';
}
function libKeyFor(cat){ return (typeof DISH_LIB!=='undefined' && DISH_LIB[cat]) ? 'lib:'+cat : null; }

/* ============ 数据 ============ */
var LS_KEY = 'wb_menu_v1';
var state = {dishes:[], seeded:false, version:1};
var editingId = null, editingImgKey = undefined, curCat = 'all';

function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){}
  if(!state.seeded){ seedDemo(); }
}
function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  }catch(e){
    toast('⚠️ 保存失败：存储空间不足（实拍图太多），请删除部分图片');
  }
}
function seedDemo(){
  var now = new Date().toISOString();
  state.dishes = [
    {id:'demo1', name:'清蒸鲈鱼', cat:'zheng', imgKey:'lib:zheng', createdAt:now, updatedAt:now,
     ingredients:['鲈鱼 1条（约500g）','葱、姜 适量','蒸鱼豉油 2勺','料酒 1勺','食用油 2勺'],
     steps:['鱼身两面划刀，抹料酒和盐腌10分钟','盘底垫葱姜，鱼身上也放几条姜丝','水开后大火蒸8分钟，关火再虚蒸2分钟','倒掉盘中腥水，铺新的葱丝姜丝','淋蒸鱼豉油，另起锅把油烧到冒烟，浇在葱丝上']},
    {id:'demo2', name:'青椒炒肉丝', cat:'chao', imgKey:'lib:chao', createdAt:now, updatedAt:now,
     ingredients:['猪里脊 250g','青椒 3个','蒜 3瓣','生抽 1勺','淀粉 1小勺'],
     steps:['里脊切丝，加生抽、淀粉、少许油抓匀腌10分钟','青椒切丝，蒜切片','热锅凉油，下肉丝滑散炒至变色盛出','余油爆香蒜片，下青椒丝大火炒至断生','倒回肉丝，加盐大火翻炒几下出锅']},
    {id:'demo3', name:'排骨藕汤', cat:'tang', imgKey:'lib:tang', createdAt:now, updatedAt:now,
     ingredients:['排骨 500g','粉藕 2节','姜片 4片','盐 适量','白胡椒粉 少许'],
     steps:['排骨冷水下锅焯水，撇净浮沫捞出','藕去皮切滚刀块','排骨、藕、姜片入砂锅，加足量热水','大火烧开转小火煨1.5小时','出锅前加盐和白胡椒粉调味']}
  ];
  state.seeded = true;
  saveState();
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dishImgHtml(d, cls){
  if(d.imgKey && d.imgKey.indexOf('data:')===0){
    return '<img class="'+cls+'" src="'+d.imgKey+'" alt="">';
  }
  if(d.imgKey && d.imgKey.indexOf('lib:')===0){
    var k = d.imgKey.slice(4);
    if(typeof DISH_LIB!=='undefined' && DISH_LIB[k]) return '<img class="'+cls+'" src="'+DISH_LIB[k]+'" alt="">';
  }
  return '<div class="'+cls+' ph">'+catEmoji(d.cat)+'</div>';
}

/* ============ 渲染 ============ */
function render(){
  var q = (document.getElementById('q').value||'').trim().toLowerCase();
  // 分类 tabs
  var counts = {}; state.dishes.forEach(function(d){counts[d.cat]=(counts[d.cat]||0)+1;});
  var tabsHtml = '<div class="tab '+(curCat==='all'?'on':'')+'" onclick="setCat(\'all\')">全部 '+state.dishes.length+'</div>';
  CATS.forEach(function(c){
    if(counts[c.key]){
      tabsHtml += '<div class="tab '+(curCat===c.key?'on':'')+'" onclick="setCat(\''+c.key+'\')">'+c.emoji+' '+c.label+' '+counts[c.key]+'</div>';
    }
  });
  document.getElementById('tabs').innerHTML = tabsHtml;
  // 过滤
  var list = state.dishes.filter(function(d){
    if(curCat!=='all' && d.cat!==curCat) return false;
    if(q){
      var hay = (d.name+' '+(d.ingredients||[]).join(' ')).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  }).sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); });
  // 网格
  if(!list.length){
    document.getElementById('grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🍽️</div>'+(state.dishes.length?'没有符合筛选的菜品':'还没有菜品，点右上角「➕ 添加菜品」试试')+'</div>';
    return;
  }
  var html = list.map(function(d){
    var stepN = (d.steps||[]).length, ingN = (d.ingredients||[]).length;
    return '<div class="card" ondblclick="openDetail(\''+d.id+'\')" ontouchend="onTouchEnd(event,\''+d.id+'\')">'+
      dishImgHtml(d,'cimg')+
      '<div class="cbody">'+
        '<div class="cname">'+esc(d.name)+'</div>'+
        '<div class="cmeta"><span class="chip" style="background:'+CAT_COLOR[d.cat]+'22;color:'+CAT_COLOR[d.cat]+'">'+catEmoji(d.cat)+' '+catLabel(d.cat)+'</span><span>'+ingN+'种食材 · '+stepN+'步</span></div>'+
        '<div class="cacts">'+
          '<button class="abtn" onclick="event.stopPropagation();openDetail(\''+d.id+'\')">🔍 放大</button>'+
          '<button class="abtn" onclick="event.stopPropagation();openEdit(\''+d.id+'\')">✏️ 编辑</button>'+
          '<button class="abtn del" onclick="event.stopPropagation();delDish(\''+d.id+'\')">🗑</button>'+
        '</div>'+
      '</div></div>';
  }).join('');
  document.getElementById('grid').innerHTML = html;
}
function setCat(k){ curCat=k; render(); }

/* 移动端双击（300ms 内两次 tap） */
var lastTap = 0, lastTapId = null;
function onTouchEnd(e, id){
  if(e.target.closest('button')) return;
  var now = Date.now();
  if(now - lastTap < 320 && lastTapId === id){ openDetail(id); lastTap=0; return; }
  lastTap = now; lastTapId = id;
}

/* ============ 编辑 ============ */
function openEdit(id){
  editingId = id || null;
  var d = null;
  if(id){ d = state.dishes.find(function(x){return x.id===id;}); if(!d) return; }
  document.getElementById('editTitle').textContent = d ? '编辑菜品' : '添加菜品';
  document.getElementById('fName').value = d ? d.name : '';
  document.getElementById('fIng').value = d ? (d.ingredients||[]).join('\n') : '';
  document.getElementById('fSteps').value = d ? (d.steps||[]).join('\n') : '';
  // 分类下拉
  var sel = document.getElementById('fCat');
  sel.innerHTML = CATS.map(function(c){return '<option value="'+c.key+'">'+c.emoji+' '+c.label+'</option>';}).join('');
  sel.value = d ? d.cat : 'other';
  editingImgKey = d ? (d.imgKey===undefined?null:d.imgKey) : undefined; // undefined=未定(保存时自动), null=占位
  updateImgPrev();
  onNameInput(!d);
  document.getElementById('editOv').classList.add('show');
  if(!d) setTimeout(function(){document.getElementById('fName').focus();},80);
}
function closeEdit(){ document.getElementById('editOv').classList.remove('show'); }
function onNameInput(skipCat){
  var name = document.getElementById('fName').value.trim();
  var c = detectCat(name);
  var hint = document.getElementById('autoHint');
  if(name && c!=='other'){
    hint.textContent = '已识别分类：' + catEmoji(c) + ' ' + catLabel(c);
    if(skipCat) document.getElementById('fCat').value = c;
  } else hint.textContent = '';
}
function updateImgPrev(){
  var prev = document.getElementById('imgPrev');
  if(editingImgKey && editingImgKey.indexOf('data:')===0){ prev.src = editingImgKey; }
  else if(editingImgKey && editingImgKey.indexOf('lib:')===0){
    var k = editingImgKey.slice(4);
    prev.src = (typeof DISH_LIB!=='undefined' && DISH_LIB[k]) ? DISH_LIB[k] : '';
  } else { prev.src = ''; prev.outerHTML = prev.outerHTML; }
  if(!prev.src){ prev.removeAttribute('src'); prev.textContent = catEmoji(document.getElementById('fCat').value); }
  else prev.textContent = '';
}
function reMatchImg(){
  var cat = document.getElementById('fCat').value;
  var k = libKeyFor(cat);
  if(!k){ toast('该分类暂无配图，可上传实拍图'); return; }
  editingImgKey = k; updateImgPrev(); toast('🎲 已按「'+catLabel(cat)+'」匹配示意图');
}
function removeImg(){ editingImgKey = null; updateImgPrev(); toast('已删除，将使用占位图'); }
function onImgPick(input){
  var f = input.files && input.files[0];
  if(!f) return;
  if(f.size > 8*1024*1024){ toast('图片太大（>8MB），请换一张'); input.value=''; return; }
  var reader = new FileReader();
  reader.onload = function(e){
    compressImg(e.target.result, 900, 0.78, function(dataUrl){
      if(dataUrl.length > 1.5*1024*1024){ compressImg(e.target.result, 640, 0.7, function(d2){ editingImgKey = d2; updateImgPrev(); toast('📷 已上传（已压缩）'); }); }
      else { editingImgKey = dataUrl; updateImgPrev(); toast('📷 已上传（已压缩）'); }
    });
  };
  reader.readAsDataURL(f);
  input.value = '';
}
function compressImg(dataUrl, maxSide, q, cb){
  var img = new Image();
  img.onload = function(){
    var w = img.width, h = img.height, s = Math.min(w,h);
    var scale = Math.min(1, maxSide/Math.max(w,h));
    var cv = document.createElement('canvas');
    cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', q));
  };
  img.onerror = function(){ cb(dataUrl); };
  img.src = dataUrl;
}
function saveDish(){
  var name = document.getElementById('fName').value.trim();
  if(!name){ toast('请填写菜名'); return; }
  var cat = document.getElementById('fCat').value;
  var ing = document.getElementById('fIng').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var steps = document.getElementById('fSteps').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var now = new Date().toISOString();
  var imgKey = editingImgKey;
  if(imgKey === undefined) imgKey = libKeyFor(cat); // 新建且未操作过图片 → 自动配
  if(imgKey && imgKey.indexOf('lib:')===0 && imgKey.slice(4)===cat){} // ok
  if(editingId){
    var d = state.dishes.find(function(x){return x.id===editingId;});
    if(d){ d.name=name; d.cat=cat; d.ingredients=ing; d.steps=steps; d.imgKey=imgKey; d.updatedAt=now; }
  } else {
    state.dishes.push({id:'d'+Date.now()+Math.random().toString(36).slice(2,6), name:name, cat:cat, ingredients:ing, steps:steps, imgKey:imgKey, createdAt:now, updatedAt:now});
  }
  saveState(); closeEdit(); render();
  toast('✅ 已保存「'+name+'」');
}
function delDish(id){
  var d = state.dishes.find(function(x){return x.id===id;});
  if(!d) return;
  if(!confirm('确定删除「'+d.name+'」吗？')) return;
  state.dishes = state.dishes.filter(function(x){return x.id!==id;});
  saveState(); render(); toast('已删除「'+d.name+'」');
}

/* ============ 详情/分享卡 ============ */
function openDetail(id){
  var d = state.dishes.find(function(x){return x.id===id;});
  if(!d) return;
  var ings = (d.ingredients||[]).map(function(s){return '<span class="ing">'+esc(s)+'</span>';}).join('');
  var steps = (d.steps||[]).map(function(s){return '<div class="step"><div class="no"></div><div>'+esc(s)+'</div></div>';}).join('');
  var html =
    dishImgHtml(d,'hero') +
    '<div class="inner">'+
      '<div class="dtop"><div class="dname">'+esc(d.name)+'</div><span class="chip" style="background:'+CAT_COLOR[d.cat]+'22;color:'+CAT_COLOR[d.cat]+'">'+catEmoji(d.cat)+' '+catLabel(d.cat)+'</span></div>'+
      (ings?'<div class="sect"><h4>🧂 食材</h4><div class="ingwrap">'+ings+'</div></div>':'')+
      (steps?'<div class="sect"><h4>👨‍🍳 制作过程</h4><div class="steplist">'+steps+'</div></div>':'')+
      '<div class="foot">🍳 我的私房菜单 · '+catLabel(d.cat)+'类</div>'+
    '</div>';
  document.getElementById('dcard').innerHTML = html;
  document.getElementById('detailOv').classList.add('show');
}
function closeDetail(){ document.getElementById('detailOv').classList.remove('show'); }

/* ============ 导入导出 ============ */
function exportJson(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'menu-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('📤 已导出备份');
}
function importJson(){
  var inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        if(!data || !Array.isArray(data.dishes)) throw new Error('bad');
        // 按 id+updatedAt 合并
        var map = {};
        state.dishes.forEach(function(d){map[d.id]=d;});
        var add=0, upd=0;
        data.dishes.forEach(function(d){
          if(!d.id || !d.name) return;
          d.cat = d.cat || detectCat(d.name);
          if(map[d.id]){
            if((d.updatedAt||'') > (map[d.id].updatedAt||'')){ 
              var i = state.dishes.findIndex(function(x){return x.id===d.id;});
              state.dishes[i]=d; upd++;
            }
          } else { state.dishes.push(d); add++; }
        });
        saveState(); render();
        toast('📥 导入完成：新增 '+add+' 道，更新 '+upd+' 道');
      }catch(err){ toast('导入失败：文件格式不对'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============ 工具 ============ */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){t.classList.remove('show');}, 2200);
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeEdit(); closeDetail(); }
});
loadState(); render();
</script>
